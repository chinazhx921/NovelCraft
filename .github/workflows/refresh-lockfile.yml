name: Repair npm lockfile and validate Cloudflare build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund

      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.68.0 deploy --dry-run

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile"
          git push origin HEAD:main
